<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>dubwise</title>
        <meta
            name="description"
            content="A dub sound system in your browser: synthesized riddims, tape echo, spring reverb, a siren and a console you can live-code or hand to an AI."
        />
        <meta name="theme-color" content="#141210" />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main>
            <header class="top">
                <div class="brand">
                    <h1>dub<span>wise</span></h1>
                    <small>a dub sound system in your browser</small>
                </div>
                <div class="transport">
                    <button id="play" type="button" aria-pressed="false">play</button>
                    <label class="field">bpm <input id="bpm" type="number" min="50" max="200" step="1" /></label>
                    <span id="keyinfo"></span>
                    <select id="preset" aria-label="Riddim preset"></select>
                    <button id="share" type="button">share</button>
                </div>
            </header>

            <section class="panel" aria-label="Step sequencer">
                <div class="bars" id="bars"></div>
                <div class="grid-wrap"><div class="grid" id="grid"></div></div>
            </section>

            <section class="desk">
                <div class="panel strips" id="strips" aria-label="Channels"></div>
                <div class="panel fx">
                    <label>echo time
                        <select id="echo-time">
                            <option value="1/8">1/8</option>
                            <option value="3/16">3/16</option>
                            <option value="1/4">1/4</option>
                            <option value="3/8">3/8</option>
                            <option value="1/2">1/2</option>
                        </select>
                        <span></span>
                    </label>
                    <label>feedback <input id="feedback" type="range" min="0" max="0.95" step="0.01" /><output for="feedback"></output></label>
                    <label>spring <input id="spring" type="range" min="0" max="1" step="0.01" /><output for="spring"></output></label>
                    <label>filter <input id="filter" type="range" min="-1" max="1" step="0.01" value="0" /><output for="filter">open</output></label>
                    <label>volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" /><output for="volume"></output></label>
                    <div class="siren" id="siren" aria-label="Siren pad: hold, slide sideways for pitch, up and down for speed">
                        <span>siren: hold, slide ↔ pitch ↕ speed</span>
                        <div class="dot"></div>
                    </div>
                </div>
            </section>

            <section class="panel console" aria-label="Console">
                <div class="log" id="log" aria-live="polite"></div>
                <form class="prompt" id="prompt">
                    <span aria-hidden="true">&gt;</span>
                    <textarea id="command" rows="1" autocomplete="off" spellcheck="false" aria-label="Console command"
                        placeholder="type help, a notation line like bpm 76, or ai followed by an idea"></textarea>
                </form>
            </section>

            <footer>
                dubwise, open source, synthesized sounds only.
                <a href="https://github.com/alb777/dubwise">source</a>
            </footer>
        </main>
        <script type="module" src="src/app.js"></script>
    </body>
</html>
