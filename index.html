<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>dubwise</title>
        <meta name="description" content="A dub sound system in your browser: synthesized riddims, tape echo, spring reverb and a siren." />
        <style>
            :root {
                --bg: #12100e;
                --panel: #1d1a16;
                --line: #3a332a;
                --text: #efe6d6;
                --muted: #a39580;
                --accent: #e8b23a;
                --hot: #d9472b;
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                background: var(--bg);
                color: var(--text);
                font: 15px/1.4 ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace;
            }
            main {
                max-width: 760px;
                margin: 0 auto;
                padding: 24px 16px 48px;
            }
            h1 {
                margin: 0;
                font-size: 28px;
                letter-spacing: 0.08em;
            }
            .tag {
                margin: 4px 0 20px;
                color: var(--muted);
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
                margin-bottom: 16px;
            }
            button,
            select {
                font: inherit;
                color: var(--text);
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 8px 14px;
                cursor: pointer;
                touch-action: none;
                user-select: none;
            }
            button[aria-pressed="true"] {
                border-color: var(--accent);
                color: var(--accent);
            }
            button.held {
                background: var(--hot);
                border-color: var(--hot);
                color: #fff;
            }
            #play {
                min-width: 90px;
                font-weight: bold;
            }
            .channels {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 10px;
                margin-bottom: 16px;
            }
            .channel {
                display: grid;
                gap: 6px;
                padding: 10px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
            }
            .channel strong {
                color: var(--muted);
                text-transform: uppercase;
                font-size: 12px;
                letter-spacing: 0.1em;
            }
            label {
                display: grid;
                gap: 6px;
                color: var(--muted);
                flex: 1 1 220px;
            }
            input[type="range"] {
                width: 100%;
                accent-color: var(--accent);
            }
            #siren {
                padding: 18px;
                flex: 1 1 100%;
            }
            #status {
                color: var(--muted);
                white-space: pre-wrap;
                min-height: 1.4em;
            }
            #status.error {
                color: var(--hot);
            }
        </style>
    </head>
    <body>
        <main>
            <h1>dubwise</h1>
            <p class="tag">a dub sound system in your browser</p>
            <div class="row">
                <select id="preset" aria-label="Riddim preset"></select>
                <button id="play" type="button">Play</button>
            </div>
            <div class="channels" id="channels"></div>
            <div class="row">
                <label>Filter: dark to thin <input id="filter" type="range" min="-1" max="1" step="0.01" value="0" /></label>
            </div>
            <div class="row">
                <button id="siren" type="button">Hold for the siren, slide sideways to bend it</button>
            </div>
            <p id="status" role="status"></p>
        </main>
        <script type="module" src="src/app.js"></script>
    </body>
</html>
