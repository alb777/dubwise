name: betoai dispatch

# One-off work: a label agent:<role> on an issue, or a /oc comment from the owner.
# The role is resolved in the plan job, then handed to the reusable agent-run.yml.
# Only the owner can trigger it with a comment, because the repo is public.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  plan:
    if: |
      (github.event_name == 'issues' && startsWith(github.event.label.name, 'agent:')) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.author_association == 'OWNER' &&
       contains(github.event.comment.body, '/oc'))
    runs-on: ubuntu-latest
    outputs:
      role: ${{ steps.pick.outputs.role }}
      issue: ${{ steps.pick.outputs.issue }}
    steps:
      - name: pick the role
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -eu
          role=""
          if [ "$EVENT" = "issues" ]; then
            case "$LABEL" in
              agent:*) role="${LABEL#agent:}" ;;
            esac
          else
            role=$(gh api "repos/${{ github.repository }}/issues/${ISSUE}/labels" \
              --jq '[.[].name | select(startswith("agent:"))][0] // ""')
            role="${role#agent:}"
          fi
          if [ -z "$role" ]; then
            echo "no agent:<role> label on issue ${ISSUE}" >&2
            exit 1
          fi
          if [ ! -f ".opencode/agents/${role}.md" ]; then
            echo "no .opencode/agents/${role}.md in this repo" >&2
            exit 1
          fi
          echo "role=${role}" >> "$GITHUB_OUTPUT"
          echo "issue=${ISSUE}" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    uses: ./.github/workflows/agent-run.yml
    with:
      role: ${{ needs.plan.outputs.role }}
      issue: ${{ needs.plan.outputs.issue }}
    secrets: inherit
