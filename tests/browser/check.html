<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>dubwise browser check</title>
    </head>
    <body>
        <pre id="result">pending</pre>
        <script type="module">
            // Renders every preset with the browser's own Web Audio and writes levels into the page,
            // so a headless browser can check the engine where it will really run.
            import { parse } from "../../skills/dubwise/scripts/notation.mjs";
            import { createEngine } from "../../src/engine.js";
            import { renderRiddim } from "../../src/sequencer.js";

            function measure(buffer) {
                let sum = 0;
                let peak = 0;
                let nan = false;
                for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
                    for (const x of buffer.getChannelData(channel)) {
                        if (Number.isNaN(x)) nan = true;
                        sum += x * x;
                        peak = Math.max(peak, Math.abs(x));
                    }
                }
                const rms = Math.sqrt(sum / (buffer.length * buffer.numberOfChannels));
                return { db: Number((20 * Math.log10(rms || 1e-12)).toFixed(1)), peak: Number(peak.toFixed(3)), nan };
            }

            const result = { userAgent: navigator.userAgent };
            try {
                for (const name of ["one-drop", "rockers", "steppers"]) {
                    const text = await (await fetch(`../../skills/dubwise/assets/riddims/${name}.txt`)).text();
                    const { riddim } = parse(text);
                    const buffer = await renderRiddim(OfflineAudioContext, (c) => createEngine(c), riddim, { seconds: 4 });
                    result[name] = measure(buffer);
                }
                result.ok = ["one-drop", "rockers", "steppers"].every((n) => {
                    const m = result[n];
                    return !m.nan && m.peak <= 1 && m.db > -35 && m.db < -8;
                });
            } catch (error) {
                result.error = String(error);
                result.ok = false;
            }
            document.getElementById("result").textContent = JSON.stringify(result);
        </script>
    </body>
</html>
